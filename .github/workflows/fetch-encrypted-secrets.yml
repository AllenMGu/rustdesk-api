name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      input_blob_sha:
        required: false
        default: ''
        type: string
      zip_url_json:
        required: false
        default: ''
        type: string

jobs:
  download-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download encrypted input blob
        if: inputs.input_blob_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BLOB_SHA: ${{ inputs.input_blob_sha }}
        shell: bash
        run: |
          case "$INPUT_BLOB_SHA" in
            *[!0-9a-f]*|'')
              echo "Invalid input blob SHA" >&2
              exit 1
              ;;
          esac
          curl --fail-with-body --location --retry 3 \
            --header "Accept: application/vnd.github.raw+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${INPUT_BLOB_SHA}" \
            --output secrets.zip

      - name: Download encrypted input from legacy callback
        if: inputs.input_blob_sha == '' && inputs.zip_url_json != ''
        env:
          ZIP_URL_JSON: ${{ inputs.zip_url_json }}
        shell: python
        run: |
          import json
          import os
          import requests

          input_data = json.loads(os.environ["ZIP_URL_JSON"])
          url = f"{input_data['url']}/get_zip?filename={input_data['file']}"
          response = requests.get(url, timeout=60)
          response.raise_for_status()
          with open("secrets.zip", "wb") as target:
              target.write(response.content)

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1
